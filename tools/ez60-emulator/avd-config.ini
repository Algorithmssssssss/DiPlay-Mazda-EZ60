# Hardware profile for the DiPlay_EZ60 emulator.
# `ez60-emu create` copies every key=value line below into the AVD's config.ini.
# Values come from the EZ-60 probe reports (Changan Mazda J90K, CAMZD OS, Android 14).

avd.ini.displayname=DiPlay EZ-60 (J90K)
PlayStore.enabled=no

# One 5120x1440 touchscreen at density 160 (car: "real=5120x1440 density=160").
# The car splits it into a driver half and a passenger half of 2560x1440 each.
hw.lcd.width=5120
hw.lcd.height=1440
hw.lcd.density=160
hw.initialOrientation=landscape
skin.name=5120x1440
skin.path=_no_skin
skin.dynamic=yes
showDeviceFrame=no

# The windshield HUD: an 800x480 presentation display (car: "MeterDisplay#0").
# The car projects only the area (573,167)-(800,355) of it.
# Flag 75 = VIRTUAL_DISPLAY_FLAG_PUBLIC | PRESENTATION | OWN_CONTENT_ONLY | SUPPORTS_TOUCH.
hw.display1.width=800
hw.display1.height=480
hw.display1.density=160
hw.display1.flag=75

# Machine size. The data partition is kept small because the Mac's disk is nearly full.
hw.ramSize=4096
vm.heapSize=512
disk.dataPartition.size=4G
hw.cpu.ncore=4

# Input and output. The Mac keyboard types into the emulator; there are no hardware keys or cameras.
hw.keyboard=yes
hw.mainKeys=no
hw.camera.back=none
hw.camera.front=none
hw.audioInput=yes
hw.audioOutput=yes
hw.gpu.enabled=yes
hw.gpu.mode=auto

# The writable system partition (it holds the J90K model name) cannot use Quick Boot snapshots.
fastboot.forceColdBoot=yes
